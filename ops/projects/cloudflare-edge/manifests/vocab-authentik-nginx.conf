server {
    listen 20002 ssl;
    listen [::]:20002 ssl;
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name vocab.nodezjc12348888.xyz;

    ssl_certificate /root/.acme.sh/nodezjc12348888.xyz_ecc/fullchain.cer;
    ssl_certificate_key /root/.acme.sh/nodezjc12348888.xyz_ecc/nodezjc12348888.xyz.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    proxy_buffers 8 16k;
    proxy_buffer_size 32k;

    location / {
        auth_request /outpost.goauthentik.io/auth/nginx;
        error_page 401 = @goauthentik_proxy_signin;

        auth_request_set $auth_cookie $upstream_http_set_cookie;
        add_header Set-Cookie $auth_cookie always;
        auth_request_set $authentik_email $upstream_http_x_authentik_email;

        proxy_pass http://127.0.0.1:29148;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cf-Access-Authenticated-User-Email $authentik_email;
        proxy_set_header Cf-Access-Jwt-Assertion authentik-forward-auth;
    }

    location /outpost.goauthentik.io {
        proxy_pass http://127.0.0.1:29000/outpost.goauthentik.io;
        proxy_set_header Host $host;
        proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        auth_request_set $auth_cookie $upstream_http_set_cookie;
        add_header Set-Cookie $auth_cookie always;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    location @goauthentik_proxy_signin {
        internal;
        add_header Set-Cookie $auth_cookie always;
        return 302 /outpost.goauthentik.io/start?rd=$scheme://$http_host$request_uri;
    }
}
